<div class="kpi-page">
  <div class="kpi-overlay"></div>

  <section class="kpi-hero">
    <h1>{{ pageTitle }}</h1>
    <p>Control who receives automated KPI emails and outage alerts.</p>
  </section>

  <section class="form-section">
    <form class="kpi-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <h2>{{ editingId ? 'Update Recipient' : 'Add New Recipient' }}</h2>

      <div class="field-group">
        <input type="email" formControlName="email" placeholder="Email address" autocomplete="off" />
        <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Please provide a valid email address.
        </span>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="form.invalid || saving">
          {{ editingId ? 'Update' : 'Add' }} Recipient
        </button>
        <button type="button" class="secondary" *ngIf="editingId" (click)="onCancelEdit()" [disabled]="saving">
          Cancel
        </button>
      </div>
    </form>
  </section>

  <section class="table-section">
    <div class="state" *ngIf="loading">Loading recipients...</div>
    <div class="state error" *ngIf="!loading && errorMessage">{{ errorMessage }}</div>
    <div class="state" *ngIf="!loading && !errorMessage && !recipients.length">No recipients configured.</div>

    <table class="kpi-table" *ngIf="!loading && recipients.length">
      <thead>
        <tr>
          <th>Email Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let recipient of recipients">
          <td>{{ recipient.email }}</td>
          <td>
            <button type="button" class="edit" (click)="onEdit(recipient)" [disabled]="saving">Edit</button>
            <button type="button" class="delete" (click)="onDelete(recipient._id)" [disabled]="saving">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</div>

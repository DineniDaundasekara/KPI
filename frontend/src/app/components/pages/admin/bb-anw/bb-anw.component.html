<div class="page-container">
  <div class="kpi-overlay"></div>

<section class="page-header">
  <div class="header-left"> <p class="eyebrow">Admin / BB & ANW</p>
    <h1>{{ pageTitle }}</h1>
    <p class="page-subtitle">
      Configure KPI definitions for BB & ANW network metrics.
    </p>
  </div>
</section>
  <div class="admin-grid">
    <section class="card form-card">
      <h2>Create KPI Row</h2>

      <form class="region-form" (ngSubmit)="submitForm()">
        <div class="form-group">
          <input type="text" [(ngModel)]="form.networkEngineerKpi" name="kpi" required placeholder="Network Engineer KPI" />
        </div>

        <div class="form-group">
          <input type="text" [(ngModel)]="form.division" name="division" placeholder="Division" />
        </div>

        <div class="form-group">
          <input type="text" [(ngModel)]="form.section" name="section" placeholder="Section" />
        </div>

        <div class="form-group">
          <input type="number" [(ngModel)]="form.kpiPercent" name="kpiPercent" required placeholder="KPI (%)" />
        </div>

        <button class="add-btn" [disabled]="saving" type="submit">
          Add
        </button>
      </form>
    </section>

    <section class="card table-card">
      <div class="table-wrapper">
        <table class="kpi-table">
          <thead>
            <tr>
              <th>Network Engineer KPI</th>
              <th>Division</th>
              <th>Section</th>
              <th>KPI (%)</th>
              <th style="text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of data">
              <td>{{ row.networkEngineerKpi }}</td>
              <td>{{ row.division }}</td>
              <td>{{ row.section }}</td>
              <td>{{ row.kpiPercent }}</td>
              <td>
                <div class="action-group">
                  <button type="button" class="icon-btn edit" (click)="editRow(row)">Edit</button>
                  <button type="button" class="icon-btn delete" (click)="deleteRow(row.kpiId)">Delete</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

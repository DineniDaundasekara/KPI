<div 
  class="dashboard-container"
  @fadeIn
  *ngIf="!loading; else loadingOrEmpty"
>
  <div class="final-tables-container">
    <div class="regions-container">
      <div 
        class="region-card"
        *ngFor="let region of regions; trackBy: trackByRegion; let idx = index"
        @slideIn
        [@hoverScale]="regionHoverStates[idx] ? 'hover' : 'normal'"
        (mouseenter)="regionHoverStates[idx] = true"
        (mouseleave)="regionHoverStates[idx] = false"
      >
        <!-- Region title -->
        <div class="region-title">
          <h3>{{ region.title }}</h3>
        </div>

        <!-- Meters -->
        <div class="meters-container">
          <div
            class="meter-item"
            *ngFor="let meter of region.meters; trackBy: trackByMeter; let mIdx = index"
            @scaleIn
            [@meterHover]="meterHoverStates[region.title + meter] ? 'hover' : 'normal'"
            (mouseenter)="meterHoverStates[region.title + meter] = true"
            (mouseleave)="meterHoverStates[region.title + meter] = false"
          >
            <div class="circular-progress-container">
              <div 
                class="circular-progress" 
                [style.background]="getCircularProgressBackground(meter, region.meters)"
              >
                <span 
                  class="progress-value"
                  [style.color]="getProgressTextColor(meter, region.meters)"
                >{{ valueForMeter(meter).toFixed(2) }}%</span>
              </div>
            </div>
            <p 
              class="meter-label"
              [style.color]="getMeterTextColor(meter, region.meters)"
              [style.font-weight]="getMeterFontWeight(meter, region.meters)"
            >
              {{ meter }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingOrEmpty>
  <div class="loading-container">
    <div *ngIf="loading" class="loading">Loading…</div>
  </div>
</ng-template>
